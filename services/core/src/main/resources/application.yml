# Los secretos y los datos de conexión se leen del archivo .env en la raíz del proyecto.
# Copia .env.example como .env y completa sus valores.
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: rinde
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rinde}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  # Cada bounded context declara su propio Flyway (esquema y migraciones propios).
  flyway:
    enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 200ms
        multiplier: 2
        max-interval: 2s
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 200ms
          multiplier: 2
          max-interval: 2s

server:
  port: 8080

rinde:
  platform:
    jwt:
      secret: ${RINDE_PLATFORM_JWT_SECRET:}
  messaging:
    exchange: ${RINDE_EVENTS_EXCHANGE:rinde.events}
    notification:
      queue: ${RINDE_NOTIFICATION_QUEUE:notification.trip-assigned}
    subscription:
      queue: ${RINDE_IAM_SUBSCRIPTION_QUEUE:iam.subscription-events}
  security:
    jwt:
      # Mínimo 32 caracteres.
      secret: ${JWT_SECRET}
  billing:
    simulation:
      enabled: ${RINDE_BILLING_SIMULATION_ENABLED:false}
      webhook-secret: ${RINDE_BILLING_SIMULATION_WEBHOOK_SECRET}
  iam:
    remote-enabled: ${RINDE_IAM_REMOTE_ENABLED:true}
    base-url: ${IAM_SERVICE_URL:http://localhost:8081}
  expense:
    remote-enabled: ${RINDE_EXPENSE_REMOTE_ENABLED:true}
    base-url: ${EXPENSE_SERVICE_URL:http://localhost:8084}
  trip:
    remote-enabled: ${RINDE_TRIP_REMOTE_ENABLED:true}
    base-url: ${TRIP_SERVICE_URL:http://localhost:8082}
  fleet:
    remote-enabled: ${RINDE_FLEET_REMOTE_ENABLED:true}
    base-url: ${FLEET_SERVICE_URL:http://localhost:8083}
  notification:
    retry:
      # Esperas en minutos antes de cada reintento; tras la quinta falla el aviso queda FAILED.
      delays-minutes: [1, 2, 4, 8, 16]
      # Cada cuánto se revisan los avisos vencidos, en milisegundos.
      poll-delay-ms: 30000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

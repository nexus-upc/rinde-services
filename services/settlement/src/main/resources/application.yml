# Los secretos y los datos de conexión se leen del archivo .env en la raíz del servicio.
# Copia .env.example como .env y completa sus valores.
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: rinde-settlement-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rinde_settlement}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  # El esquema settlement se migra con Flyway desde SettlementFlywayConfiguration.
  flyway:
    enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Confirmaciones del broker y devolución de los mensajes sin cola, igual que en core.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 200ms
        multiplier: 2
        max-interval: 2s
    listener:
      simple:
        # Un mensaje rechazado no vuelve a la cola: se descarta y queda registrado en el log.
        default-requeue-rejected: false

server:
  port: 8086

rinde:
  messaging:
    exchange: ${RINDE_EVENTS_EXCHANGE:rinde.events}
    settlement:
      queue: ${RINDE_SETTLEMENT_TRIP_QUEUE:rinde.events.settlement.trip-events}
  security:
    jwt:
      # Mínimo 32 caracteres. Debe ser el mismo secreto que usa IAM para emitir los tokens.
      secret: ${JWT_SECRET}
  iam:
    base-url: ${IAM_SERVICE_URL:http://localhost:8081}
  trip:
    base-url: ${TRIP_SERVICE_URL:http://localhost:8082}
  fleet:
    base-url: ${FLEET_SERVICE_URL:http://localhost:8083}
  expense:
    base-url: ${EXPENSE_SERVICE_URL:http://localhost:8084}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

# Los secretos y los datos de conexión se leen del archivo .env en la raíz del servicio.
# Copia .env.example como .env y completa sus valores.
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: rinde-settlement-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rinde_settlement}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  # El esquema settlement se migra con Flyway desde SettlementFlywayConfiguration.
  flyway:
    enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

server:
  port: 8086

rinde:
  security:
    jwt:
      secret: ${JWT_SECRET}
  expense:
    base-url: ${EXPENSE_SERVICE_URL:http://localhost:8084}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

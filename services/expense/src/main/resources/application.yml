# Los secretos y los datos de conexión se leen del archivo .env en la raíz del servicio.
# Copia .env.example como .env y completa sus valores.
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: rinde-expense-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rinde_expense}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  # El esquema expense se migra con Flyway desde ExpenseFlywayConfiguration.
  flyway:
    enabled: false
  servlet:
    multipart:
      # Límite del contenedor. El comprobante se valida después con rinde.evidence.max-size-bytes.
      max-file-size: 10MB
      max-request-size: 10MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Un mensaje rechazado no vuelve a la cola: se descarta y queda registrado en el log.
        default-requeue-rejected: false

server:
  port: 8084

rinde:
  security:
    jwt:
      # Mínimo 32 caracteres. Debe ser el mismo secreto que usa IAM para emitir los tokens.
      secret: ${JWT_SECRET}
  iam:
    service-url: ${IAM_SERVICE_URL:http://localhost:8081}
  trip:
    service-url: ${TRIP_SERVICE_URL:http://localhost:8082}
  evidence:
    # Tamaño máximo de cada comprobante en bytes (5 MB por defecto).
    max-size-bytes: ${RINDE_EVIDENCE_MAX_SIZE_BYTES:5242880}
    storage:
      # Carpeta de los comprobantes. En Docker es un volumen; no se expone por HTTP.
      local-path: ${RINDE_EVIDENCE_STORAGE_PATH:./data/evidences}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
